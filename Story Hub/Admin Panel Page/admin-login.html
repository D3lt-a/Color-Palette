<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Admin Login</h2>
    <form id="adminLoginForm" onsubmit="return validateAdminLogin()">
        <label for="adminUsername">Username:</label>
        <input type="text" id="adminUsername" name="adminUsername" required><br><br>
        <label for="adminPassword">Password:</label>
        <input type="password" id="adminPassword" name="adminPassword" required><br><br>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="admin-register.html">Register here</a></p>
    <script src="admin-login.js"></script>
</body>
</html>
