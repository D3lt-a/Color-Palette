<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Admin Registration</h2>
    <form id="adminRegisterForm" onsubmit="return validateAdminRegister()">
        <label for="registerUsername">Username:</label>
        <input type="text" id="registerUsername" name="registerUsername" required><br><br>
        <label for="registerPassword">Password:</label>
        <input type="password" id="registerPassword" name="registerPassword" required><br><br>
        <button type="submit">Register</button>
    </form>
    <script src="admin-register.js"></script>
</body>
</html>
