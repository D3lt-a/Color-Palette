<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Admin Panel</h2>
    <div>
        <h3>Registered Users: <span id="userCount">0</span></h3>
        <h3>Total Time Spent on Page: <span id="totalTime">0</span> minutes</h3>
    </div>
    <canvas id="userStatsChart" width="400" height="200"></canvas>
    <button id="logout">Logout</button>
    <script src="admin.js"></script>
    <script>
        // Check if admin is logged in
        if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
            alert('You must be logged in as an admin to view this page.');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
